<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>常青圈 Cookie 助手</title>
    <style>
      :root {
        --primary: #7c9885;
        --primary-deep: #5e7a66;
        --primary-tint: #eaf1ea;
        --ink: #3a413c;
        --ink-2: #6b746c;
        --ink-3: #9aa39c;
        --line: #e3e8e3;
        --warn: #e0b775;
        --ok: #8ab58a;
        --risk: #c67d72;
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', sans-serif;
        color: var(--ink);
        background: #fafbf9;
      }
      .title { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
      .sub { font-size: 11px; color: var(--ink-3); margin: 0 0 14px; line-height: 1.5; }
      button {
        width: 100%;
        height: 40px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover { background: var(--primary-deep); }
      button:active { transform: scale(0.98); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.link {
        width: auto;
        height: auto;
        margin-top: 8px;
        padding: 0;
        background: none;
        color: var(--ink-2);
        font-size: 11px;
        font-weight: 400;
        text-decoration: underline;
      }
      button.link:hover { background: none; color: var(--ink); }
      button.link:active { transform: none; }
      .opt {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        font-size: 11px;
        color: var(--ink-3);
        cursor: pointer;
      }
      .opt input { margin: 0; accent-color: var(--primary); }
      .divider { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
      #status {
        margin-top: 12px;
        font-size: 12px;
        line-height: 1.6;
        padding: 8px 10px;
        border-radius: 10px;
        display: none;
      }
      #status.ok { display: block; background: rgba(138,181,138,0.15); color: var(--ok); }
      #status.err { display: block; background: rgba(224,183,117,0.15); color: #b9863f; }
      #status.risk { display: block; background: rgba(198,125,114,0.15); color: var(--risk); }
      #status .meta { display: block; margin-top: 2px; font-size: 11px; opacity: 0.85; }
      .hint { margin-top: 12px; font-size: 11px; color: var(--ink-3); line-height: 1.6; }
    </style>
  </head>
  <body>
    <p class="title">常青圈 Cookie 助手</p>
    <p class="sub">在已登录的抖音 / 小红书 / B站 页面打开本扩展，一键复制登录 Cookie。</p>

    <label class="opt" for="onlyKey">
      <input type="checkbox" id="onlyKey" />
      仅保留关键字段（串更短，未登录时会拦截）
    </label>
    <button id="copy">复制当前站点 Cookie</button>
    <div id="status"></div>
    <button id="force" class="link" hidden>仍要复制（不保证可用）</button>
    <p class="hint">复制后回到常青圈「模型配置 → 编辑配置 → 平台采集」，粘进对应框保存即可。</p>
    <script src="popup.js"></script>
  </body>
</html>
