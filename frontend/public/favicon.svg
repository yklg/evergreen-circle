<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="常青圈 EvergreenCircle">
  <!-- 常青圈 EvergreenCircle 品牌图标
       造型取自 public/assets/brand/logo.png 的嫩芽（大叶 + 小叶 + 茎 + 种子），
       配色与 index.css 的品牌主色 #7c9885 同源，与侧边栏 logo 片同构。
       用「品牌色圆角片 + 奶白嫩芽」而非透明底绿芽：16px 的浏览器标签上
       任意明暗主题都能保持对比度，不会糊成一团。

       本文件按 XML 文档被浏览器解析，没有 HTML 那套容错：注释体内一旦出现
       连续两个减号，整份 SVG 即解析失败、图标静默不显示。
       所以注释里不要写 CSS 自定义属性名 —— 它们正是那样开头的。 -->
  <defs>
    <linearGradient id="verdaTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8daa97"/>
      <stop offset="1" stop-color="#6b8875"/>
    </linearGradient>
  </defs>

  <!-- 品牌色圆角片 -->
  <rect x="0" y="0" width="48" height="48" rx="10.5" fill="url(#verdaTile)"/>

  <!-- 嫩芽（奶白）：种子 + 茎 + 大叶 + 小叶 -->
  <g fill="#f7faf5">
    <circle cx="20.6" cy="35.4" r="2.7"/>
    <path d="M23.4 22.8 C26.2 13.2 32.6 9.2 38 9.6 C37.8 15.8 33 21.6 23.4 22.8 Z"/>
    <path d="M20.6 27.6 C17 23.4 12.6 22.2 9.8 23.4 C10.8 27.2 15.4 29.4 20.6 27.6 Z"/>
  </g>
  <!-- 茎画在叶片之上，形成「叶从茎生」的层次 -->
  <path d="M20.8 33.4 C19.2 29.2 20 25.2 23.4 22.4"
        stroke="#f7faf5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
