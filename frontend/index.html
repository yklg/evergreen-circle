<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 品牌图标：SVG 主图标（任意尺寸清晰）+ iOS 触屏图标（PNG，由 make_brand_icon.py 从 favicon.svg 生成）。
         ?v= 只是投递手段：浏览器会记住「这个图标 URL 解析失败」，改过 favicon.svg 后
         不递增 v 就可能一直沿用旧结论。但图标能否显示真正取决于 favicon.svg 自身的
         XML 良构性（2026-09-27 那份因注释里有连续两个减号而整份解析失败，
         标签页于是退回历史里唯一解析成功过的 Vite 默认闪电），由 brand.test.ts 的解析判据守着。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <!-- 移动端地址栏配色，与 index.css 的 --c-primary 同源（品牌色 #7c9885） -->
    <meta name="theme-color" content="#7c9885" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=optional（不是 swap）是有原因的，别改回去：
         swap 会在 ~700ms 处换面，CJK 字宽变化让顶栏从两行收回一行，地图格随之 572→620px，
         整屏内容跳一次（1280 档实测；拦掉 webfont 则全程 84px 不跳）。
         optional 是"到位就用、没到位这趟就不换" ⇒ 一次定形，无重排。
         回归网在 e2e/lifeCircleStage.spec.ts 的「首屏不抖」那条。 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=optional"
      rel="stylesheet"
    />
    <!-- 注意：本行必须与 src/lib/brand.ts 的 BRAND.title 一致，由 src/lib/brand.test.ts 守卫 -->
    <title>常青圈 EvergreenCircle · 15 分钟生活圈智能体检与规划助手</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
