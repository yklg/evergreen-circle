# 路径②：Nginx 反代到 evergreen-worker 容器（SSE 友好）
#
# 前置：把本文件放到 /etc/nginx/conf.d/evergreen.conf（或 main 里 include）。
# 域名自行替换；HTTPS 用 certbot 加 listen 443 ssl + ssl_certificate 段。
# 关键：proxy_buffering off + proxy_read_timeout 调高 —— 否则 SSE 思维流会被缓冲/截断。
# 后端已在响应头发 X-Accel-Buffering: no，这里再保险关一次缓冲。

upstream evergreen_worker {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name evergreen.example.com;   # TODO: 替换为你的域名

    # 健康检查（供监控 / 探活）
    location = /health {
        proxy_pass http://evergreen_worker/health;
        proxy_set_header Host $host;
    }

    # REST API + SSE 思维流
    location /api/ {
        proxy_pass http://evergreen_worker;
        proxy_http_version 1.1;
        # SSE 是 HTTP/1.1 流式，不需要 WebSocket 的 Upgrade；清空 Connection 保 keepalive
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长任务 SSE 不被反向代理截断（执行由 runner 独立驱动，超时只影响展示）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # 可选：同一域名托管前端静态构建（frontend/dist）
    # location / {
    #     root /var/www/evergreen-circle/frontend/dist;
    #     try_files $uri $uri/ /index.html;
    # }
}
