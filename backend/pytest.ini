; 项目级 pytest 配置（2026-10-13 新增，此前无配置文件、靠 cwd=backend 隐式定 rootdir）。
;
; 这里只做一件事：**让意外联网物理不可能**。
; `--disable-socket` 把任何真实 socket 调用变成 SocketBlockedError 并指名是哪条用例 ——
; 这是发现"某条测试偷偷打真接口"的唯一可靠手段（本仓之前没有任何东西在守这条）。
;
; 两个豁免各自有据：
;   --allow-unix-socket                    本机的 unix socket（数据库/系统调用走这条）；
;   --allow-hosts=127.0.0.1,localhost,::1  `tests/test_fetch_ssrf_poc.py` 那族用例**故意**起回环
;                                          服务器来证明抓取器拒内网 —— 它们必须能连本机。
;
; 实测（2026-10-13）：加这两个豁免后在既有套件上跑全量 = 2802 passed / 4 skipped / 23 xfailed，
; 与无旗标基线**逐字一致**；只加 --disable-socket 不加 --allow-hosts 会红 8 条 + 3 error
; （全部落在那族 SSRF 用例上）⇒ 这两行豁免是必需的，不是顺手放宽。
;
; 依赖：pytest-socket（见 requirements-dev.txt，MIT、唯一依赖 pytest>=7、纯 Python）。

[pytest]
addopts = --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1
